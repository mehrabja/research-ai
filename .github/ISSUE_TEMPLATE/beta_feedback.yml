name: Beta tester feedback
description: Share structured feedback from an approved Research AI test
title: "[Beta feedback]: "
labels: ["beta-feedback", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Only submit feedback using non-confidential test material. Never upload unpublished papers, private research documents, personal data, access tokens, or API keys.
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Python, Node and database version, as applicable.
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Workflow tested
      options:
        - Installation / first run
        - Literature discovery
        - Source ingestion
        - PDF or document extraction
        - Evidence retrieval
        - Research planning
        - Manuscript workflow
        - Collaboration / workspace
        - Other
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: What did you try?
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What worked or failed?
    validations:
      required: true
  - type: textarea
    id: sanitized
    attributes:
      label: Sanitized evidence
      description: Logs or screenshots with all private data removed.
      render: text
    validations:
      required: false
