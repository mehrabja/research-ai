name: Feature request
description: Propose an improvement to Research AI
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the research or maintainer problem first. For large features, discuss scope before opening a pull request.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What workflow or user need is not supported today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Use case or evidence
      description: Describe the user impact without including private research data.
    validations:
      required: false
