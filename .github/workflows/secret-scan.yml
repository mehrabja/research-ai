name: Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan every reachable branch and tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out all refs and history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Scan all reachable Git history
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/path" \
            --workdir /path \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="--all" --redact --verbose --no-banner .
