name: Chaos & Recovery
on:
  workflow_dispatch:
  push:
    paths:
      - "apps/api/app/providers/**"
      - "apps/api/app/services/jobs.py"
      - "apps/api/tests/failure/**"
      - "apps/api/tests/providers/**"
      - "apps/api/tests/storage/**"
      - "apps/api/tests/workers/**"
      - "scripts/chaos_recovery.py"
permissions:
  contents: read
jobs:
  recovery:
    name: Phase 18 recovery suite
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        working-directory: apps/api
    env:
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap Windows CI toolchain
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_bootstrap.ps1
      - name: Start PostgreSQL
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_postgres.ps1
      - name: Install backend
        shell: powershell
        run: & $env:CI_PYTHON -m pip install -e ".[dev]"
      - name: Apply migrations
        shell: powershell
        run: & $env:CI_PYTHON -m alembic upgrade head
      - name: Run Phase 18 recovery suite
        shell: powershell
        run: & $env:CI_PYTHON ../../scripts/chaos_recovery.py
      - name: Cleanup PostgreSQL
        if: always()
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_postgres_cleanup.ps1
