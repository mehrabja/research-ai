name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: research-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Backend
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        working-directory: apps/api
    env:
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
      LOG_FORMAT: text
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap Windows CI toolchain
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_bootstrap.ps1
      - name: Start PostgreSQL
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_postgres.ps1
      - name: Install backend
        shell: powershell
        run: |
          & $env:CI_PYTHON -m pip install -e ".[dev]"
      - name: Ruff
        shell: powershell
        run: |
          & $env:CI_PYTHON -m ruff check app tests
      - name: Mypy
        shell: powershell
        run: |
          & $env:CI_PYTHON -m mypy app
      - name: Alembic upgrade/head/downgrade/upgrade
        shell: powershell
        run: |
          & $env:CI_PYTHON -m alembic upgrade head
          & $env:CI_PYTHON -m alembic current
          & $env:CI_PYTHON -m alembic heads
          & $env:CI_PYTHON -m alembic downgrade -1
          & $env:CI_PYTHON -m alembic upgrade head
      - name: Application smoke import/health
        shell: powershell
        run: |
          & $env:CI_PYTHON scripts/smoke_test.py
      - name: Backend tests
        shell: powershell
        run: |
          & $env:CI_PYTHON -m pytest tests -q
      - name: Cleanup PostgreSQL
        if: always()
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_postgres_cleanup.ps1

  web:
    name: Frontend
    runs-on: [self-hosted, windows, x64]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap Windows CI toolchain
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_bootstrap.ps1
      - name: Node/npm versions
        shell: powershell
        run: |
          node --version
          npm --version
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - name: Frontend security audit
        shell: powershell
        run: |
          & $env:CI_PYTHON python ../../scripts/frontend_security_audit.py

  docker:
    name: Docker
    runs-on: [self-hosted, windows, x64]
    needs: quality
    steps:
      - uses: actions/checkout@v6
      - name: Verify Docker
        shell: powershell
        run: docker version
      - run: docker build -t research-ai-api:ci -f apps/api/Dockerfile apps/api
      - run: docker build -t research-ai-web:ci -f apps/web/Dockerfile apps/web

  e2e:
    name: Frontend E2E
    runs-on: [self-hosted, windows, x64]
    needs: web
    defaults:
      run:
        working-directory: apps/web
    env:
      BACKEND_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://research:research_test_password@127.0.0.1:55432/research_test
      TEST_DATABASE_URL: postgresql+psycopg://research:research_test_password@127.0.0.1:55432/research_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
      RATE_LIMIT_ENABLED: "false"
      BILLING_PROVIDER: fake
      GOOGLE_OAUTH_CLIENT_ID: ci-google-client-id
      GOOGLE_OAUTH_CLIENT_SECRET: ci-google-client-secret
      GOOGLE_OAUTH_REDIRECT_URI: http://127.0.0.1:3000/oauth/google/callback
      GITHUB_OAUTH_CLIENT_ID: ci-github-client-id
      GITHUB_OAUTH_CLIENT_SECRET: ci-github-client-secret
      GITHUB_OAUTH_REDIRECT_URI: http://127.0.0.1:3000/oauth/github/callback
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap Windows CI toolchain
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_bootstrap.ps1
      - name: Start PostgreSQL
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_postgres.ps1
      - name: Install backend
        shell: powershell
        working-directory: apps/api
        run: |
          & $env:CI_PYTHON -m pip install -e ".[dev]"
      - name: Apply migrations
        shell: powershell
        working-directory: apps/api
        run: |
          & $env:CI_PYTHON -m alembic upgrade head
      - name: Start FastAPI
        shell: powershell
        working-directory: apps/api
        run: |
          $stdout = Join-Path $env:GITHUB_WORKSPACE 'api-e2e.stdout.log'
          $stderr = Join-Path $env:GITHUB_WORKSPACE 'api-e2e.stderr.log'
          $process = Start-Process -FilePath $env:CI_PYTHON -ArgumentList '-m','uvicorn','app.main:app','--host','127.0.0.1','--port','8000' -WorkingDirectory $PWD -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          Set-Content -Path (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.pid') -Value $process.Id
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:8000/api/v1/health/live' -TimeoutSec 3
              if ($response.StatusCode -eq 200) { exit 0 }
            } catch {}
            Start-Sleep -Seconds 1
          }
          Get-Content $stdout -ErrorAction SilentlyContinue
          Get-Content $stderr -ErrorAction SilentlyContinue
          throw 'FastAPI did not become ready.'
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Stop FastAPI
        if: always()
        shell: powershell
        working-directory: .
        run: |
          $pidFile = Join-Path $env:GITHUB_WORKSPACE 'api-e2e.pid'
          if (Test-Path $pidFile) {
            $apiPid = Get-Content $pidFile | Select-Object -First 1
            Stop-Process -Id ([int]$apiPid) -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -Force -ErrorAction SilentlyContinue $pidFile
      - name: Show FastAPI log
        if: failure()
        shell: powershell
        working-directory: .
        run: |
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.stdout.log') -ErrorAction SilentlyContinue
          Get-Content (Join-Path $env:GITHUB_WORKSPACE 'api-e2e.stderr.log') -ErrorAction SilentlyContinue
      - name: Cleanup PostgreSQL
        if: always()
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_postgres_cleanup.ps1

  release-gate:
    name: Release Gate
    runs-on: [self-hosted, windows, x64]
    needs: [quality, web, e2e, docker]
    steps:
      - uses: actions/checkout@v6
      - name: Bootstrap Windows CI toolchain
        shell: powershell
        working-directory: .
        run: .\scripts\windows_ci_bootstrap.ps1
      - name: Frontend security audit
        shell: powershell
        run: |
          & $env:CI_PYTHON scripts/frontend_security_audit.py
      - name: Final audit
        shell: powershell
        run: |
          & $env:CI_PYTHON scripts/final_audit.py
      - name: Required release artifacts
        shell: powershell
        run: |
          $required = @(
            'scripts/production_smoke.py',
            'scripts/staging_deploy.ps1',
            'scripts/staging_chaos.ps1',
            'scripts/staging_backup_restore.ps1'
          )
          foreach ($path in $required) { if (-not (Test-Path $path)) { throw "Missing $path" } }
