name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

defaults:
  run:
    working-directory: apps/api

jobs:
  quality:
    name: Lint / Typecheck / Tests / Migration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research_test_password
          POSTGRES_DB: research_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      TEST_DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
      LOG_FORMAT: text

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check app tests

      - name: Mypy
        run: mypy app

      - name: Migration gate — upgrade head
        run: alembic upgrade head

      - name: Migration gate — assert head
        run: |
          alembic current
          alembic heads

      - name: Migration gate — downgrade one
        run: alembic downgrade -1

      - name: Migration gate — re-upgrade
        run: alembic upgrade head

      - name: Smoke test — app boot
        run: python -c "from app.main import app; print('OK app')"

      - name: Smoke test — script
        run: python scripts/smoke_test.py

      - name: Tests
        run: pytest tests -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build \
            -t research-ai-api:ci \
            -f apps/api/Dockerfile \
            apps/api