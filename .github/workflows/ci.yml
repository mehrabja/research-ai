name: CI
permissions:
  contents: read
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research_test_password
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      TEST_DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
      LOG_FORMAT: text
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic current && alembic heads
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: python -c "from app.main import app; print('OK app')"
      - run: python scripts/smoke_test.py
      - run: pytest tests -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: "20"}
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run audit:connections
      - run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d research_ai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/research_ai_test
      API_OPENAPI_URL: http://127.0.0.1:8000/openapi.json
      NEXT_PUBLIC_API_BASE: /api/backend
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head
      - name: Start backend
        working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/research-ai-api.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health/live", timeout=2) as response:
                      if response.status == 200:
                          break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("backend health endpoint did not become ready")
          PY
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      - uses: actions/setup-node@v6
        with:
          node-version: "20.9.0"
      - name: Install frontend
        working-directory: apps/web
        run: npm install
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: apps/web
        run: npm run test:e2e

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: docker build -t research-ai-api:ci -f apps/api/Dockerfile apps/api
