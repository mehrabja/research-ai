name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  quality:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research_test_password
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      TEST_DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
      LOG_FORMAT: text
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic current && alembic heads
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: python -c "from app.main import app; print('OK app')"
      - run: python scripts/smoke_test.py
      - run: pytest tests -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:unit
      - run: python ../../scripts/frontend_security_audit.py

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-ai-api:ci -f apps/api/Dockerfile apps/api

  e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: web
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research_test_password
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/web
    env:
      BACKEND_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      TEST_DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: npm install
      - working-directory: apps/api
        run: pip install -e ".[dev]"
      - working-directory: apps/api
        run: alembic upgrade head
      - working-directory: apps/api
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/research-ai-api.log 2>&1 &
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/v1/health/live"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print("FastAPI is ready")
                          break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI did not become ready. See /tmp/research-ai-api.log")
          PY
      - run: npm run test:e2e

  release-gate:
    name: Release Gate
    runs-on: ubuntu-latest
    needs: [quality, web, e2e, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python scripts/frontend_security_audit.py
      - run: |
          test -f scripts/production_smoke.py
          test -f scripts/backup_postgres.sh
          test -f scripts/restore_postgres.sh
