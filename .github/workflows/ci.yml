name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  quality:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: research
          POSTGRES_PASSWORD: research_test_password
          POSTGRES_DB: research_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U research -d research_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      TEST_DATABASE_URL: postgresql+psycopg://research:research_test_password@localhost:5432/research_test
      JWT_SECRET_KEY: ci-test-secret-not-used-in-production-min-32b
      APP_ENV: test
      DEBUG: "false"
      LOG_FORMAT: text
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - run: alembic upgrade head
      - run: alembic current && alembic heads
      - run: alembic downgrade -1
      - run: alembic upgrade head
      - run: python -c "from app.main import app; print('OK app')"
      - run: python scripts/smoke_test.py
      - run: pytest tests -q
  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: E2E
    services:
      postgres:
        image: pgvector/pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d research_ai_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/research_ai_test
      API_OPENAPI_URL: http://127.0.0.1:8000/openapi.json
      NEXT_PUBLIC_API_BASE: /api/backend
      AUTH_REQUIRE_EMAIL_VERIFICATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"
      - name: Migrate database
        working-directory: apps/api
        run: alembic upgrade head
      - uses: actions/setup-node@v6
        with:
          node-version: "20.9.0"
      - name: Install frontend
        working-directory: apps/web
        run: npm install
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: apps/web
        run: npm run test:e2e

  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t research-ai-api:ci -f apps/api/Dockerfile apps/api
