name: One-shot Ruff autofix

on:
  push:
    branches: ["phase123-integration"]

permissions:
  contents: write

jobs:
  ruff-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase123-integration
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Apply Ruff autofixes
        working-directory: apps/api
        run: ruff check app tests --fix || true

      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api
          git rm .github/workflows/ruff-autofix-once.yml
          if git diff --cached --quiet; then
            echo "No Ruff changes were produced."
            exit 0
          fi
          git commit -m "style: apply Ruff autofixes"
          git push origin HEAD:phase123-integration
