name: Ruff diagnostic

on:
  push:
    branches: ["phase123-integration"]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase123-integration

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: apps/api
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run Ruff and capture diagnostics
        working-directory: apps/api
        run: |
          set +e
          ruff check app tests > /tmp/ruff.txt 2>&1
          status=$?
          {
            echo "ruff_exit=$status"
            cat /tmp/ruff.txt
          } > ruff-ci.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ruff-ci-diagnostics
          path: apps/api/ruff-ci.txt
