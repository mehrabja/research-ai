# Local development compose file (M36).
# This is NOT a production deployment.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research_dev_password
      POSTGRES_DB: research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research -d research"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development
      DEBUG: "true"
      LOG_FORMAT: text
      DATABASE_URL: postgresql+psycopg://research:research_dev_password@db:5432/research
      JWT_SECRET_KEY: dev-insecure-secret-change-me-before-production
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./backups:/app/backups
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata: