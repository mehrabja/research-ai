name: research-ai-staging

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: research_ai
      POSTGRES_USER: research_ai
      POSTGRES_PASSWORD: staging-local-only
      TZ: UTC
      PGTZ: UTC
    volumes:
      - research_ai_staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_ai -d research_ai"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./runtime/staging.env
    environment:
      APP_ENV: staging
      DEBUG: "false"
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://research_ai:staging-local-only@db:5432/research_ai
      WEB_APP_BASE_URL: http://127.0.0.1:13000
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:13000,http://localhost:13000
      CORS_ALLOW_CREDENTIALS: "true"
      TRUSTED_HOSTS: "*"
      FILE_STORAGE_BACKEND: local
      FILE_STORAGE_LOCAL_ROOT: /app/storage/files
      BILLING_PROVIDER: none
      DETECTION_PROVIDER: sapling
      SOURCE_DISCOVERY_PROVIDER: openalex
      AUTH_REQUIRE_VERIFIED_EMAIL: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${STAGING_API_PORT:-18000}:8000"
    volumes:
      - ./runtime/storage:/app/storage
      - ./runtime/backups:/app/backups
      - ./runtime/smoke-credentials.json:/run/research-ai/smoke-credentials.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=4); raise SystemExit(0 if r.status == 200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${STAGING_WEB_PORT:-13000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  research_ai_staging_pgdata:
